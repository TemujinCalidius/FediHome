name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least-privilege token — the job only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest

    # A throwaway Postgres so the manual migrations can be executed for real
    # (#384). Every other test mocks @/lib/db, which is exactly how a
    # non-idempotent migration shipped: the SQL that runs on every install had
    # never been run by a test.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fedihome_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Generate the Prisma client so the typecheck can resolve @prisma/client.
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Gate on lint *errors* only (eslint exits non-zero on errors, not
      # warnings) so a regression like a broken `<Link>`/hook rule fails CI,
      # while the existing warning backlog (#83) is burned down separately.
      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test
        env:
          # Opts the manual-migration tests in; they skip without it.
          FEDIHOME_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fedihome_test

      # A production build catches Next-specific breakage that tsc misses
      # (server/client boundaries, route config) and that `npm run update`
      # would otherwise hit on deploy. Most routes are force-dynamic, so a
      # placeholder DATABASE_URL is enough — the build doesn't connect.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/fedihome
          SITE_URL: http://localhost:3000
